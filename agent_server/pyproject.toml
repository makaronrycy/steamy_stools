[project]
name = "agent_server"
version = "0.1.0"
description = "MCP server"
authors = [
    {name = "Maurycy Szmuc", email = "s193194@student.pg.edu.pl"},
]
readme = "./README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastmcp",
    'mcp>=1.0.0',
    'requests>=2.28.1',
    'py2neo',
    'aiohttp',
    'starlette',
    'uvicorn',
    'anyio',
    "neo4j",
    "openai",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
