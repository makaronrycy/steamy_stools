version: '3.8'

services:
  # === Bazy danych ===
  neo4j:
    image: neo4j:5.15-community
    container_name: steamy-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_max__size=512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - steamy-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: steamy-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - steamy-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: steamy-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - steamy-network

  # === Aplikacja ===
  # Using override Dockerfiles from root to fix poetry --no-dev deprecation
  agent-server:
    build:
      context: .
      dockerfile: Dockerfile.agent-server
    container_name: steamy-agent-server
    ports:
      - "10000:10000"
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - WORKERS=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - steamy-network
    restart: unless-stopped

  agent-client:
    build:
      context: .
      dockerfile: Dockerfile.agent-client
    container_name: steamy-agent-client
    ports:
      - "3000:3000"
    environment:
      - MCP_SERVER_URL=http://agent-server:10000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - agent-server
    networks:
      - steamy-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steamy-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGODB_URI=${MONGO_URI}
      - SONAR_HOST_URL=http://sonarqube:9000
      - SONAR_API_URL=http://sonarqube:9000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_URL=${GITHUB_URL}
      - SONAR_TOKEN=${SONAR_TOKEN}
      - WORKSPACE_DIR=/app/workspace
      - HOST_WORKSPACE_DIR=${HOST_WORKSPACE_DIR:-./backend/workspace}
      - DOCKER_NETWORK=steamy_stools_steamy-network
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/workspace:/app/workspace
      - ./backend/data:/app/data
      - ./backend/assumptions:/app/assumptions
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - steamy-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: steamy-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
      - VITE_AGENT_URL=http://localhost:3000
    depends_on:
      - backend
      - agent-client
    networks:
      - steamy-network
    restart: unless-stopped

networks:
  steamy-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  mongodb_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
