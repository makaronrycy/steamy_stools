version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: zsd-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - SONAR_HOST_URL=http://sonarqube:9000
      - SONAR_API_URL=http://sonarqube:9000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_URL=${GITHUB_URL}
      - SONAR_TOKEN=${SONAR_TOKEN}
      - WORKSPACE_DIR=/app/workspace
      - HOST_WORKSPACE_DIR=${PWD}/backend/workspace
      - NEO4J_URI=neo4j://steamy-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock 
      - ./backend/workspace:/app/workspace        
    depends_on:
      - mongo
      - sonarqube
      - steamy-neo4j
    networks:
      - zsd-network

  frontend:
    build:
      context: ./frontend
    container_name: zsd-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000 
    networks:
      - zsd-network

  mongo:
    image: mongo:latest
    container_name: zsd-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - zsd-network

  sonarqube:
    image: sonarqube:community
    container_name: zsd-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    networks:
      - zsd-network

  # === Merged from steamy_stools ===
  steamy-neo4j:
    image: neo4j:5.15-community
    container_name: steamy-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_max__size=512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - zsd-network
  
  steamy-agent-server:
    build:
      context: ./steamy_stools/agent_server
      dockerfile: dockerfile
    container_name: steamy-agent-server
    ports:
      - "10000:10000"
    environment:
      - NEO4J_URI=neo4j://steamy-neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - WORKERS=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - steamy-neo4j
    networks:
      - zsd-network
    restart: unless-stopped

  steamy-agent-client:
    build:
      context: ./steamy_stools/agent_client
      dockerfile: dockerfile
    container_name: steamy-agent-client
    ports:
      - "3000:3000"
    environment:
      - MCP_SERVER_URL=http://steamy-agent-server:10000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - steamy-agent-server
    networks:
      - zsd-network
    restart: unless-stopped

volumes:
  mongo-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
  neo4j_data:
  neo4j_logs:

networks:
  zsd-network:
    driver: bridge
