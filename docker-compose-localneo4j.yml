version: '3.8'

services:
  # Neo4j Database
  neo4j:
    image: neo4j:5.15-community
    container_name: steamy-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - steamy-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Agent Server (MCP Server)
  agent-server:
    build:
      context: ./agent_server
      dockerfile: dockerfile
    container_name: steamy-agent-server
    ports:
      - "10000:10000"
    env_file:
      - ./agent_server/.env
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - WORKERS=${WORKERS:-1}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - steamy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Agent Client
  agent-client:
    build:
      context: ./agent_client
      dockerfile: dockerfile
    container_name: steamy-agent-client
    ports:
      - "3000:3000"
    env_file:
      - ./agent_client/.env
    environment:
      - MCP_SERVER_URL=http://agent-server:10000
    depends_on:
      agent-server:
        condition: service_healthy
    networks:
      - steamy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  steamy-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
