version: '3.8'

services:
  # Neo4j Database
  neo4j:
    image: neo4j:5.15-community
    container_name: steamy-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_max__size=512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - steamy-network
    # Removed healthcheck because curl/wget are missing in the image
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:7474 || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

  # Agent Server (MCP Server)
  agent-server:
    build:
      context: ./agent_server
      dockerfile: dockerfile
    container_name: steamy-agent-server
    ports:
      - "10000:10000"
    env_file:
      - ./agent_server/.env
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - WORKERS=${WORKERS:-1}
    depends_on:
      - neo4j
    networks:
      - steamy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:10000/mcp || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Agent Client
  agent-client:
    build:
      context: ./agent_client
      dockerfile: dockerfile
    container_name: steamy-agent-client
    ports:
      - "3000:3000"
    env_file:
      - ./agent_client/.env
    environment:
      - MCP_SERVER_URL=http://agent-server:10000
    depends_on:
      agent-server:
        condition: service_healthy
    networks:
      - steamy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  webapp-backend:
    build: 
      context: ../backend
      dockerfile: Dockerfile
    container_name: webapp-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCP_AGENT_URL=http://steamy-agent-server:10000
    depends_on:
      - agent-server
    networks:
      - steamy-network

  webapp-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: webapp-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_AGENT_URL=http://localhost:3000
    depends_on:
      - webapp-backend
    networks:
      - steamy-network

networks:
  steamy-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
